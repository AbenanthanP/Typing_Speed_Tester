<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes — Typing Speed Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="quotes">
  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="6" width="20" height="13" rx="2"></rect>
        <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"></path>
      </svg>
      <h1>Typing Speed Tester</h1>
    </div>
    <p class="subtitle">Test how fast and accurately you can type.</p>
  </header>

  <nav class="tabs" aria-label="Typing modes">
    <a class="tab-btn" href="index.html">Paragraph</a>
    <a class="tab-btn" href="easy-words.html">Easy Words</a>
    <a class="tab-btn" href="quotes.html" aria-current="page">Quotes</a>
    <a class="tab-btn" href="custom-text.html">Custom Text</a>
    <a class="tab-btn" href="results.html">Results</a>
  </nav>

  <main>
    <section class="mode-panel">
      <p class="mode-description">Type a famous quote from start to finish. There is no time limit — the round ends when you reach the last character.</p>
      <div id="practice-root"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Typing Speed Tester</p>
    <button id="reset-scores-btn" class="link-btn">Reset high scores</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
